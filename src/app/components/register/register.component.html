<mat-card class="form-card">
  <mat-card-header>
    <mat-card-title>Crear usuario</mat-card-title>
    <mat-card-subtitle>Rellena los campos a continuación</mat-card-subtitle>
  </mat-card-header>

  <mat-card-content>
    <form>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Nombre</mat-label>
        <input matInput placeholder="Ingrese su nombre">
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Email</mat-label>
        <input matInput placeholder="Ingrese su email">
      </mat-form-field>

      <mat-form-field appearance="fill" class="form-field">
        <mat-label>Contraseña</mat-label>
        <input
          matInput
          placeholder="Ingrese su contraseña"
          [type]="hide() ? 'password' : 'text'"
          required
          />
        <button
          mat-icon-button
          matSuffix
          (click)="clickEvent($event)"
          [attr.aria-pressed]="hide()"
        >
          <mat-icon>{{hide() ? 'visibility_off' : 'visibility'}}</mat-icon>
        </button>
      </mat-form-field>
    </form>
  </mat-card-content>

  <mat-card-actions>
    <button mat-button color="primary">Crear</button>
    <button  mat-raised-button (click)="login()" color="accent">Ingresar</button>
  </mat-card-actions>
</mat-card>
